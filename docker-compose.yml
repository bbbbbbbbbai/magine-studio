name: imagine-studio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imagine}
      POSTGRES_USER: ${POSTGRES_USER:-imagine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imagine_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imagine} -d ${POSTGRES_DB:-imagine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://imagine:imagine_dev_password@db:5432/imagine}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash-vision-exp}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-pollinations}
      IMAGE_MODEL: ${IMAGE_MODEL:-z-image-2.5}
      POLLINATIONS_MODEL: ${POLLINATIONS_MODEL:-flux}
      Z_IMAGE_MODEL: ${Z_IMAGE_MODEL:-z-image-2.5}
      GPT_IMAGE_MODEL: ${GPT_IMAGE_MODEL:-gpt-image-2.5}
      GPT_IMAGE_API_BASE_URL: ${GPT_IMAGE_API_BASE_URL:-https://api.openai.com/v1}
      GPT_IMAGE_API_KEY: ${GPT_IMAGE_API_KEY:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-https://api.openai.com/v1}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      MEDIA_DIR: /app/media
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ROOT_USER_UUID: ${ROOT_USER_UUID:-}
    volumes:
      - generated_images:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_REFERENCE_DATA_BASE: ${VITE_REFERENCE_DATA_BASE:-https://raw.githubusercontent.com/anhao/ai-pose-gallery-zh/main}
        VITE_REFERENCE_ASSET_BASE: ${VITE_REFERENCE_ASSET_BASE:-https://ai-pose-gallery.anhao.app}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  generated_images:
