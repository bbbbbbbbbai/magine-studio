name: Publish and deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python -m ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  publish:
    name: Publish GHCR images
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image names
        run: |
          echo "RELEASE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
          echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_BASE }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_REFERENCE_DATA_BASE=https://raw.githubusercontent.com/anhao/ai-pose-gallery-zh/main
            VITE_REFERENCE_ASSET_BASE=https://ai-pose-gallery.anhao.app
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_BASE }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to server
    needs:
      - publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull images and restart services
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_PORT: ${{ vars.RELEASE_PORT || '3001' }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only origin main && \
             RELEASE_PORT='$RELEASE_PORT' DEPLOY_IMAGE_TAG='$RELEASE_TAG' \
             GHCR_IMAGE_BASE='$IMAGE_BASE' \
             bash scripts/deploy-server.sh"
